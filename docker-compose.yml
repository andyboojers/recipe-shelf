version: '3.9'
services:
  backend:
    build: ./backend
    container_name: recipe-shelf-backend
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./secrets:/secrets
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - SERVICE_ACCOUNT_FILE=/secrets/service_account.json
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: recipe-shelf-frontend
    restart: unless-stopped
    ports:
      - "3004:80"
    depends_on:
      - backend
