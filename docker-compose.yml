version: '3.9'
services:
  backend:
    build: ./backend
    container_name: recipe-shelf-backend
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: recipe-shelf-frontend
    restart: unless-stopped
    ports:
      - "3004:80"
    depends_on:
      - backend
